# Tests on every push and pull request: unit, integration and simulation tests plus the build,
# then the browser tests (headless Chromium with software WebGL, as on the development machine).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/assets/check-register.mjs

  e2e:
    name: Browser tests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: docs/reports/e2e-*/
          if-no-files-found: ignore
